name = "vision"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
# Exact origins the gateway may send users back to (comma-separated).
ALLOWED_RETURN_ORIGINS = "https://id-preview--270c21c8-994a-43a9-b10c-f5ef0ab2bf73.lovable.app,https://project--270c21c8-994a-43a9-b10c-f5ef0ab2bf73-dev.lovable.app,https://project--270c21c8-994a-43a9-b10c-f5ef0ab2bf73.lovable.app,https://270c21c8-994a-43a9-b10c-f5ef0ab2bf73.lovableproject.com,http://localhost:8080"

# Secrets (set with `wrangler secret put`, never committed):
# GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET,
# STATE_KEY, SIGNING_KEY, NVIDIA_API_KEY, GROQ_API_KEY
# The /ai relay authorizes callers by their Origin header against ALLOWED_RETURN_ORIGINS (no shared token).
# Deploy only with: cd auth-gateway && npx wrangler deploy -c wrangler.toml (root .wrangler redirect points elsewhere)

# Gmail SMTP credentials from the account Secrets Store (used by POST /mail).
[[secrets_store_secrets]]
binding = "SMTP_EMAIL"
store_id = "b4394e5cddb24a46b6984c69ce02b8b6"
secret_name = "SMTP_EMAIL"

[[secrets_store_secrets]]
binding = "SMTP_PASSWORD"
store_id = "b4394e5cddb24a46b6984c69ce02b8b6"
secret_name = "SMTP_PASSWORD"
# MAIL_TOKEN: Worker secret shared with the app (app env MAIL_TOKEN).

# VISION database: used only by the /runtime relay for GitHub Actions jobs.
[[d1_databases]]
binding = "DB"
database_name = "vision"
database_id = "ded73090-4d47-45ac-952f-24ae2beaba5f"

# Workers AI binding for the /ai relay (Cloudflare model). NVIDIA_API_KEY and
# GROQ_API_KEY are Worker secrets already set on "vision".
[ai]
binding = "AI"
